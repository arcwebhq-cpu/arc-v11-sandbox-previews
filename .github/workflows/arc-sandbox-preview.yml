name: ARC sandbox preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - arc-v11-sandbox-seed-00000000/index.html
      - arc-v11-sandbox-seed-00000000/services/index.html
      - arc-v11-sandbox-seed-00000000/about/index.html
      - arc-v11-sandbox-seed-00000000/process/index.html
      - arc-v11-sandbox-seed-00000000/contact/index.html
  push:
    branches: [main]
    paths:
      - arc-v11-sandbox-seed-00000000/index.html
      - arc-v11-sandbox-seed-00000000/services/index.html
      - arc-v11-sandbox-seed-00000000/about/index.html
      - arc-v11-sandbox-seed-00000000/process/index.html
      - arc-v11-sandbox-seed-00000000/contact/index.html

permissions:
  contents: read

jobs:
  validate-five-page:
    name: ARC sandbox preview five-page contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the trusted prior contract
        if: github.event_name == 'pull_request' || github.event.before != 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .trusted-contract
          fetch-depth: 0
          persist-credentials: false
      - name: Check out candidate bytes without executing them
        if: github.event_name == 'pull_request' || github.event.before != 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: .candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact one-time bootstrap
        if: github.event_name == 'push' && github.event.before == 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the reviewed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Verify the candidate with the trusted prior contract
        if: github.event_name == 'pull_request' || github.event.before != 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        run: node .trusted-contract/scripts/verify-event.mjs
        env:
          ARC_TRUSTED_CONTRACT_ROOT: ${{ github.workspace }}/.trusted-contract
          ARC_CANDIDATE_ROOT: ${{ github.workspace }}/.candidate
      - name: Validate candidate bytes without candidate code execution
        if: github.event_name == 'pull_request' || github.event.before != 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        run: |
          node .trusted-contract/scripts/validate-preview.mjs
          node .trusted-contract/scripts/secret-scan.mjs
          node .trusted-contract/scripts/build-pages.mjs --check
        env:
          ARC_PUBLIC_SEED_ROOT: ${{ github.workspace }}/.candidate
      - name: Recheck the trusted contract tests
        if: github.event_name == 'pull_request' || github.event.before != 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        run: node --test .trusted-contract/tests/*.test.mjs
      - name: Require workflow-only GitHub Pages from the trusted contract
        if: github.event_name == 'pull_request' || github.event.before != 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        run: node .trusted-contract/scripts/verify-pages-mode.mjs
        env:
          ARC_TRUSTED_CONTRACT_ROOT: ${{ github.workspace }}/.trusted-contract
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the one-time exact bootstrap event
        if: github.event_name == 'push' && github.event.before == 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        run: npm run verify:event
      - name: Validate the one-time exact bootstrap
        if: github.event_name == 'push' && github.event.before == 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        run: npm test
      - name: Require workflow-only Pages for the one-time bootstrap
        if: github.event_name == 'push' && github.event.before == 'af590c1ae9d40b97bebc4645e6a0921baacce3e2'
        run: npm run verify:pages-mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy ARC sandbox preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-five-page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: arc-v11-sandbox-preview-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact merged head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the reviewed Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Reverify the merged source and head
        run: npm run verify:event
      - name: Revalidate the dependency-free public seed
        run: npm test
      - name: Recheck workflow-only GitHub Pages
        run: npm run verify:pages-mode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the strict public allowlist
        run: npm run build:pages
      - name: Configure workflow-only GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the exact Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages
          path: .pages-dist
          include-hidden-files: true
      - name: Deploy the exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
